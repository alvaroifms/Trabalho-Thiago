<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login do Estudante</title>
</head>
<body>

    <h2>Login do Estudante</h2>
    
    <form id="form-login">
        <input type="email" placeholder="E-mail:" id="login-email" required><br><br>
        <input type="password" placeholder="Senha:" id="login-senha" required><br><br>
        
        <input type="submit" value="Entrar">
        <button type="button" id="btn-ir-cadastro">Não tenho cadastro</button>
    </form>

    <script src="login-estudante.js"></script>
</body>
</html>
