<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login do Professor</title>
</head>
<body>

    <h2>Login do Professor (Administração)</h2>
    
    <form id="form-login-professor">
        <input type="text" placeholder="Usuário/E-mail:" id="prof-usuario" required><br><br>
        <input type="password" placeholder="Senha de Acesso:" id="prof-senha" required><br><br>
        
        <input type="submit" value="Acessar Painel">
        <a href="index.html"><button type="button">Voltar ao Início</button></a>
    </form>

    <script>
        const form = document.querySelector('#form-login-professor')
        
        form.onsubmit = (e) => {
            e.preventDefault()
            const usuario = document.querySelector('#prof-usuario').value
            const senha = document.querySelector('#prof-senha').value

            
            if (usuario === 'admin' && senha === '1234') {
                alert('Acesso autorizado, Professor!')
                window.location.href = 'painel-professor.html' 
            } else {
                alert('Credenciais de professor inválidas!')
            }
        }
    </script>
</body>
</html>
